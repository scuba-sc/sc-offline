# sc-offline launcher settings. Lines are "key = value"; a line starting with "#" is a comment.

# Your Star Citizen folder. Leave it commented out and the launcher finds the game itself
# (RSI Launcher records, usual folders, then a drive search, then a folder picker). Any of these forms work:
#   game = D:\Games\Roberts Space Industries
#   game = D:\Games\Roberts Space Industries\StarCitizen\LIVE
# game =

# Which install to use when game points above it: LIVE, PTU, EPTU, ...
channel = LIVE

# Boot map. PU_All boots every star system, so Travel can reach Pyro and Nyx.
# Older ChrisWareOffline DLLs understand only PU.
boot_map = PU_All

# Legacy startup requests, still read and passed to the host. Empty start leaves the game's own spawn.
# The spawn plugin refuses destination startup, so neither key gives a timed Daymar arrival or boarding.
# start_ship does not select a normal menu spawn.
start_ship = DRAK_Cutlass_Black
start =
# Your aUEC balance is not set here: it lives in data\wallet.txt (see docs/features.md).

# Load plugins from data\plugins\<id>\ (see docs/features.md, Plugins). A plugin runs its own code
# inside the game, so only install plugins you trust. mod.log lists every plugin found. The release
# stages the native plugins spawn, crew, build, mining, npc, inspector, teleport, quantum, contracts
# and creative (all on), and discord (off; Discord presence is unavailable). Data packs are lists
# and game data, not plugins with code. on or off.
plugins = on
# Host policy for movement through sco-core's game.relocation (teleport F8, Travel destinations, saved spots).
# off disables movement for every plugin. Movement reports its own result. It also needs a confirmed
# offline session, a live player and a known star system, and each plugin has its own setting too.
# on or off.
relocation = on

# Multiplayer page (the plugin is sc-mp, not in the release): no socket opens until you press Host or Join.
# A session listens on loopback only. A LAN session needs an explicit host bind and exact peers, and a
# host that certifies an offline session; see https://github.com/scuba-sc/sc-mp. on or off.
multiplayer = on
# Firewall ranges only. They never widen what a session may do, and a value already in this file is not
# consent to a session. Only ranges wholly inside private, loopback, link-local or 100.64.0.0/10
# shared space are accepted.
multiplayer_allow =
# Ship terminals (ASOP), personal hangars, the hangar ship lift and ATC hails: Deliver stores a ship at
# the station, Retrieve brings it up in your hangar, Store takes it back. mod.log lists each part as
# ready or not. Stored ships last for the session. on or off.
asop = on
# Which ship list the terminals show with asop on: ships (every ship in data\ships.txt) or game (the
# game's own; offline its query fails, so it is empty). ships or game. The saved-selection editor is
# not enabled in this build.
asop_fleet_list = ships
# Which in-game menu the mod shows. imgui: the classic menu, the one used so far. rust: the new menu
# (sc_offline_menu.dll) draws the same pages with egui. It has never run in a game, so it is opt-in. It opens
# on M. It works only with sc-offline.exe and dinput8-rust-menu.dll beside it; the launcher then installs that
# file as dinput8.dll. The classic launcher always installs the default dinput8.dll and shows the classic
# menu. The change takes effect on the next Play. imgui or rust.
menu = imgui
# Natural mining belongs to data/plugins/mining/plugin.ini [settings], off by default.
# Old mining/mining_debug ini and SC_OFFLINE_MINING* environment switches are ignored.
# To migrate deliberately with launcher/game closed, see data/plugins/mining/README.md.

# While you play, the launcher changes these on your PC and undoes them when the game closes.
# Windows asks for administrator rights once per play. Set any of them to off to do it yourself.
# block_network: Windows Firewall rules that block StarCitizen.exe (this install only), the RSI Launcher
# and the game's CrashHandler.exe while you play. sc-offline.exe itself stays online for updates.
block_network = on
# eac_hosts: the hosts line that stops the RSI Launcher downloading Easy Anti-Cheat again.
eac_hosts = on
# eac_rename: renames EasyAntiCheat_EOS.exe to .bak so Easy Anti-Cheat doesn't start.
eac_rename = on

# After the game closes, list the logs it wrote this session (Game.log, logbackups, Crashes).
# ask: ask before deleting them (the question also offers "Always delete" and "Never delete",
#      which write always or never here); always: delete them without asking; never: keep them.
# Older logs are never touched. The window's Settings page sets this too. (on = ask and off = never still work.)
clean_logs = ask

# After a crash, offer to zip the logs (RSI handle, account numbers and Windows user name
# replaced) into data\crash-reports and open the bug form. Nothing is sent by itself. on or off.
crash_reports = on

# Check GitHub for a newer sc-offline when you play, and ask before installing it.
# Your saves and this file are kept. on or off. (sc-offline.exe update checks on demand.)
check_updates = on

# Which releases the update check offers: stable (full releases only) or prerelease
# (test builds too). stable or prerelease.
update_channel = stable

# Launcher UI language: auto (default), en or ru. Auto follows the Windows UI language.
# Russian is built in; data\locales\ru.ini can override it. See docs/localization.md.
# Invalid overrides or missing font glyphs use English. CLI output and plugin-owned text stay unchanged.
language = auto
# Game capability switches. sco-core starts each of these only when the launcher passes it to the game,
# and these keys are how it does that. They are on in this package and you can turn any of them off with
# "off". Only exp_loadout_async has been seen working in game (one or two sessions); the others have not
# been run in game. When a key is off the launcher also removes the variable from the game's environment,
# so a value left in your shell or in Windows cannot turn it on behind your back.
# The launcher prints one line at start listing the switches that are on. on or off.
# exp_loadout_async: lets the menu equip gear (game.loadout.async). Seen working in game: gear was attached.
exp_loadout_async = on
# exp_inventory_read: lets plugins read what you wear and carry (game.inventory.read). Not run in game.
exp_inventory_read = on
# exp_actor_stats_write: lets plugins change your survival stats (game.actor_stats.write). Not run in game.
exp_actor_stats_write = on
# exp_cvars_native: lets plugins read four console settings, read only (game.cvars.read). Not run in game.
exp_cvars_native = on
# exp_audio_native: asks for native one-shot sounds. This sco-core refuses them and logs why. Not run in game.
exp_audio_native = on
# exp_entities_diag: log-only entity hooks and one walk written to mod.log (diagnostics for bug reports, no gameplay change; off unless you are asked). Not run in game.
exp_entities_diag = off

# Test only: 1 writes data\registry-dump.txt (entity classes confirmed through the game's name lookup) 15 s after you spawn.
# registry_probe = 1
