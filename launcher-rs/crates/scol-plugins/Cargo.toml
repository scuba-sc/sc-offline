# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "scol-plugins"
description = "Plugin package verifier and plugin.ini parser for the sc-offline Rust launcher (no UI, no network, never loads plugin code)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Inflate only. Pure Rust backend (miniz_oxide), no C code, no zlib. Licence MIT OR Apache-2.0.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# NFC and NFKC for the path collision checks. Licence MIT OR Apache-2.0.
unicode-normalization = "0.1"
