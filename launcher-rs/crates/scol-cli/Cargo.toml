# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "scol-cli"
description = "The sc-offline Rust launcher command line: play, install, uninstall, status, mcp, help and the hidden helper and self-test modes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# `cargo run` without --bin starts the real command line.
default-run = "sc-offline"

# The command line. Same arguments, text and exit codes as the C++ sc-offline.exe, plus `plugins`.
[[bin]]
name = "sc-offline"
path = "src/main.rs"

# The older name of the same program, kept because the parity scripts run it. It costs one small file.
[[bin]]
name = "scol"
path = "src/scol.rs"

# The P0 toolchain proof. CI still checks this binary's imports.
[[bin]]
name = "scol-hello"
path = "src/hello.rs"

[dependencies]
scol-contract = { path = "../scol-contract" }

[target.'cfg(windows)'.dependencies]
scol-install = { path = "../scol-install" }
scol-mcp = { path = "../scol-mcp" }
scol-config = { path = "../scol-config" }
scol-catalogue = { path = "../scol-catalogue" }
scol-update = { path = "../scol-update" }
scol-plugin-manager = { path = "../scol-plugin-manager" }
# The window. Linked in, so `sc-offline.exe --window` needs no second file.
scol-ui = { path = "../scol-ui" }
# `real` compiles the real host: the helper process, the named events, the game start and the PC changes.
scol-play = { path = "../scol-play", features = ["real"] }

[dev-dependencies]
scol-pcchanges = { path = "../scol-pcchanges" }
