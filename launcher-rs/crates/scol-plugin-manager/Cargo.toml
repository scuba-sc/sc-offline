# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "scol-plugin-manager"
description = "Plugin management for the sc-offline Rust launcher: list, enable, disable, install from a folder or zip, remove, and the signed catalogue (list, install, update). No UI, no plugin code is ever loaded."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Adds `--test-trust-key <file>` so a TEST key can be trusted for a proof run. Never enabled in a
# release build: without it the only trust root is the one compiled into scol-catalogue.
test-trust = []

[[bin]]
name = "scol-pm"
path = "src/main.rs"

[dependencies]
scol-plugins = { path = "../scol-plugins" }
scol-catalogue = { path = "../scol-catalogue" }
# Inflate only, same backend as scol-plugins.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
ed25519-compact = { version = "2", default-features = false, features = ["std"] }
