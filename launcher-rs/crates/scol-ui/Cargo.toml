# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "scol-ui"
description = "sc-offline Rust launcher window (egui, glow): Home, Output, Plugins, Capabilities, Settings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `scol-ui.exe` opens the window. The CLI crate can call `scol_ui::run` instead (see README).
[[bin]]
name = "scol-ui"
path = "src/main.rs"

[features]
# Compiles in the signed golden catalogue index and the TEST key, for the self test and screenshots only.
# Never enable for a release build.
fixtures = []

[dependencies]
scol-contract = { path = "../scol-contract" }
scol-config = { path = "../scol-config" }
scol-plugins = { path = "../scol-plugins" }
scol-catalogue = { path = "../scol-catalogue" }
scol-install = { path = "../scol-install" }
# Inflate for plugin zips (same backend as scol-plugins: pure Rust, no C code).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"
# glow renderer only (decision of the P4 spike). Default features off: egui's bundled fonts stay out.
eframe = { version = "0.37.0", default-features = false, features = ["glow"] }

[dev-dependencies]
ed25519-compact = { version = "2", default-features = false, features = ["std"] }
