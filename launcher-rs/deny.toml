# SPDX-License-Identifier: GPL-3.0-only
# cargo-deny gate. Run: cargo deny check
[graph]
targets = ["x86_64-pc-windows-msvc"]

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Zlib",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "ISC",
  "BSL-1.0",
  # The workspace itself is GPL-3.0-only (sc-offline is GPL-3.0-only). Dependencies under the
  # same licence can be combined with it. Anything else copyleft (AGPL, LGPL, MPL, EPL, CDDL,
  # GPL-2.0-only) is not on this list and fails the check.
  "GPL-3.0-only",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

