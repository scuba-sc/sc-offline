[build]
target-dir = "target"

[target.x86_64-pc-windows-msvc]
rustflags = [
  # Static CRT: no vcruntime or ucrt DLL import (same rule as the C++ launcher).
  "-C", "target-feature=+crt-static",
  # Reproducible PE: no timestamp in the link output.
  "-C", "link-arg=/Brepro",
]
