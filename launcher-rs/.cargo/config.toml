# SPDX-License-Identifier: GPL-3.0-only
[build]
target-dir = "target"

[target.x86_64-pc-windows-msvc]
rustflags = [
  # Static CRT: no vcruntime or ucrt DLL import (same rule as the C++ launcher).
  "-C", "target-feature=+crt-static",
  # Reproducible PE: no timestamp in the link output.
  "-C", "link-arg=/Brepro",
  # Workspace crate paths are relative to launcher-rs/, so this hides the layout in panic
  # and debug strings. Registry crate paths under CARGO_HOME are not covered here; CI
  # should also pass --remap-path-prefix for CARGO_HOME through RUSTFLAGS.
  "--remap-path-prefix=crates=/scol/crates",
]
