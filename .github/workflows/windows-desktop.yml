name: Windows desktop installer

on:
  push:
    paths: ['windows/**', '.github/workflows/windows-desktop.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows-desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build installer and run desktop policy checks
        shell: powershell
        run: ./windows/build.ps1 -RunTests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SCOffline-Windows-Setup
          path: windows/out/SCOfflineSetup.exe
          if-no-files-found: error
          retention-days: 14
