name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default to read; only the release job asks for write.
permissions:
  contents: read

# A newer push to the same branch or PR replaces the running build; tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Seconds on Linux: parse errors and MSVC C2712 risks fail here, before the Windows build.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # external/sco-core: its headers are parsed with src/.
          submodules: true

      - name: Install clang + mingw-w64 headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang g++-mingw-w64-x86-64-posix

      - name: tools/check.sh
        run: tools/check.sh

      - name: SDK proof generator defaults and explicit overrides
        run: python3 tools/test_sdk_generators.py

      # The result a built-in command answers (sco-core #12): SCO_FAILED once it ran and failed,
      # SCO_UNAVAILABLE only for a capability this build doesn't have.
      - name: Built-in result tests
        run: |
          set -eu
          c++ -std=c++20 -I src/builtins -I external/sco-core/include tools/builtins_result_test.cpp -o builtins_result_test
          ./builtins_result_test

      # G1 admission evidence decision core: any failed or unparseable OS reading is Unknown, never Clear.
      - name: Admission evidence tests
        run: |
          set -eu
          c++ -std=c++20 -I src tools/admission_evidence_test.cpp -o admission_evidence_test
          ./admission_evidence_test

      - name: Headless menu size and tab overflow tests
        run: python3 tools/check_menu_window.py

      - name: Release manifest and NPC external wiring tests
        run: |
          python3 tools/test_release_manifest.py
          python3 tools/test_npc_release.py
          python3 tools/test_external_release.py

      # Byte parity alone can bless simultaneous drift: keep an independent immutable source pin.
      - name: Exact ImGui third-party ABI pin and refusal tests
        run: |
          python3 tools/test_imgui_pin.py
          python3 tools/imgui-pin.py

      # The ImGui headers sco-core's SDK ships for plugin UI must be the ones this product links.
      - name: ImGui headers match the SDK's
        run: |
          set -eu
          for f in imconfig.h imgui.h LICENSE.txt; do
            cmp "src/third_party/imgui/$f" "external/sco-core/sdk/third_party/imgui/$f"
          done
          echo "src/third_party/imgui and external/sco-core/sdk/third_party/imgui match"

  # Its own job, not a step of `check`: `build` waits for `check`, so a failing scan gate there
  # would also hide whether the sources compile. The two answers are independent. Like every job
  # here it runs on pull requests and on each push to main, so a green main shows the gate holds.
  no-scans:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Zero raw pattern scans under src/
        run: tools/no-scans.sh

  # src/builtins/ is a consumer of the sco SDK: it may include only the SDK zip's public headers and
  # its own files. The header list comes from external/sco-core's sdk/components.json, or its legacy
  # sdk/package.py CONTENT table (hence the submodule);
  # the exceptions, one reason each, are in tools/sdk-headers-allow.txt. Its own job for the same
  # reason as no-scans.
  sdk-headers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: The gate's own tests (manifest and legacy forms, fail-closed)
        run: python3 tools/test_sdk_headers.py

      - name: Built-ins include only SDK headers
        run: python3 tools/sdk-headers.py

  # External workflows use only the published SDK; none of these jobs initializes the host submodule.
  inspector-sdk-posix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published SDK (combined core + game)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download sdk-v2.4.0-rc.1 -R scuba-sc/sco-core -p 'sco-sdk-2.4.0.zip' -p SHA256SUMS -D "$RUNNER_TEMP/sdk-assets"
      - name: Isolated inspector build, full dependency traces, negative controls and checker
        run: python3 tools/check_inspector_sdk.py --archive "$RUNNER_TEMP/sdk-assets/sco-sdk-2.4.0.zip" --sums "$RUNNER_TEMP/sdk-assets/SHA256SUMS" --work "$RUNNER_TEMP/inspector-proof"

  inspector-sdk:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published SDK (combined core + game)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download sdk-v2.4.0-rc.1 -R scuba-sc/sco-core -p 'sco-sdk-2.4.0.zip' -p SHA256SUMS -D "$env:RUNNER_TEMP/sdk-assets"
      - name: Isolated MSVC inspector, module workflow, full dependency traces and checker
        run: python tools/check_inspector_sdk.py --archive "$env:RUNNER_TEMP/sdk-assets/sco-sdk-2.4.0.zip" --sums "$env:RUNNER_TEMP/sdk-assets/SHA256SUMS" --work "$env:RUNNER_TEMP/inspector-proof"
      - name: Upload enabled inspector release folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inspector-plugin
          path: ${{ runner.temp }}/inspector-proof/stage/data/plugins
          if-no-files-found: error
          retention-days: 30

  npc-sdk-posix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published SDK (combined core + game)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download sdk-v2.4.0-rc.1 -R scuba-sc/sco-core -p 'sco-sdk-2.4.0.zip' -p SHA256SUMS -D "$RUNNER_TEMP/sdk-assets"
      - name: Isolated NPC build, lifecycle module test, full dependency traces, negative controls and checker
        run: python3 tools/check_npc_sdk.py --archive "$RUNNER_TEMP/sdk-assets/sco-sdk-2.4.0.zip" --sums "$RUNNER_TEMP/sdk-assets/SHA256SUMS" --work "$RUNNER_TEMP/npc-proof"

  npc-sdk:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published SDK (combined core + game)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download sdk-v2.4.0-rc.1 -R scuba-sc/sco-core -p 'sco-sdk-2.4.0.zip' -p SHA256SUMS -D "$env:RUNNER_TEMP/sdk-assets"
      - name: Isolated MSVC NPC, lifecycle module test, full dependency traces and checker
        run: python tools/check_npc_sdk.py --archive "$env:RUNNER_TEMP/sdk-assets/sco-sdk-2.4.0.zip" --sums "$env:RUNNER_TEMP/sdk-assets/SHA256SUMS" --work "$env:RUNNER_TEMP/npc-proof"
      - name: Upload enabled NPC release folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npc-plugin
          path: ${{ runner.temp }}/npc-proof/stage/data/plugins
          if-no-files-found: error
          retention-days: 30

  # Contracts: the built-in is gone (G1 refuses builtin inputs with early DataCore), so its
  # published-SDK proof is what stands between the feature and shipping nothing. Refuses in game
  # until the missions/economy providers land; no built-in fallback, no host-side tick.
  contracts-sdk:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published SDK (combined core + game)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download sdk-v2.4.0-rc.1 -R scuba-sc/sco-core -p 'sco-sdk-2.4.0.zip' -p SHA256SUMS -D "$env:RUNNER_TEMP/sdk-assets"
      - name: Isolated MSVC contracts build, read-slice module workflow, full dependency traces and checker
        run: python tools/contracts_sdk_check.py --archive "$env:RUNNER_TEMP/sdk-assets/sco-sdk-2.4.0.zip" --sums "$env:RUNNER_TEMP/sdk-assets/SHA256SUMS" --work "$env:RUNNER_TEMP/contracts-proof" --slice read
      - name: Upload enabled contracts release folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contracts-plugin
          path: ${{ runner.temp }}/contracts-proof/stage/data/plugins
          if-no-files-found: error
          retention-days: 30

  # Proofs: check_creative_sdk.py, check_discord_sdk.py, check_crew_sdk.py, check_spawn_sdk.py, check_build_sdk.py,
  # check_teleport_sdk.py, check_quantum_sdk.py.
  # Isolated native features; checker and compiler traces use published archives only.
  # Every external plugin consumes the one published SDK 2.4.0 (release candidate 1, tag sdk-v2.4.0-rc.1).
  # The archive is named for the SDK version; the tag carries the -rc.1 suffix.
  external-sdk:
    strategy:
      fail-fast: false
      matrix:
        # mining requires the newly published game SDK; the old pin must refuse, not fall back.
        feature: [creative, discord, crew, spawn, build, mining, teleport, quantum]
    runs-on: windows-2025-vs2026
    env:
      SDK_VERSION: '2.4.0'
      SDK_TAG: 'sdk-v2.4.0-rc.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$env:SDK_TAG" -R scuba-sc/sco-core -p "sco-sdk-$env:SDK_VERSION.zip" -p SHA256SUMS -D "$env:RUNNER_TEMP/sdk-assets"
      - name: Build, test, check and stage independent feature
        env:
          FEATURE: ${{ matrix.feature }}
        run: python "tools/check_${env:FEATURE}_sdk.py" --archive "$env:RUNNER_TEMP/sdk-assets/sco-sdk-$env:SDK_VERSION.zip" --sums "$env:RUNNER_TEMP/sdk-assets/SHA256SUMS" --work "$env:RUNNER_TEMP/feature-proof"
      - name: Upload published-SDK release folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-${{ matrix.feature }}-plugin
          path: ${{ runner.temp }}/feature-proof/stage/data/plugins
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  build:
    needs: check
    # Pinned: the project builds with the v145 toolset, which this image carries (VS 2026).
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # external/sco-core is built into dinput8.dll.
          submodules: true

      - name: Configure (x64)
        run: |
          cmake --version
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      # The properties players and the release depend on, read from the binaries themselves.
      # dumpbin and mt come from the image's VS 2026 and Windows SDK.
      - name: Verify binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'build/bin/Release'
          $dll = "$dir/dinput8.dll"; $exe = "$dir/sc-offline.exe"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin -or -not $mt) { throw "dumpbin ($dumpbin) or mt ($mt) not found" }
          $script:failed = 0
          function Check([bool]$ok, [string]$what) {
            if ($ok) { "PASS  $what" } else { "FAIL  $what"; $script:failed++ }
          }

          '--- dinput8.dll exports'
          $exports = & $dumpbin /nologo /exports $dll
          $exports | Select-String 'DirectInput8Create|number of functions|number of names' | ForEach-Object { $_.Line.Trim() }
          Check ([bool]($exports -match '^\s*1\s+\S+\s+DirectInput8Create \(forwarded to C:\\Windows\\System32\\dinput8\.DirectInput8Create\)')) 'dinput8.dll exports DirectInput8Create (ordinal 1), forwarded to System32 dinput8'

          foreach ($f in $dll, $exe) {
            $name = Split-Path $f -Leaf
            "--- $name"
            $machine = (& $dumpbin /nologo /headers $f | Select-String 'machine \(' | Select-Object -First 1).Line.Trim()
            $machine
            Check ($machine -match '^8664 machine \(x64\)$') "$name is machine x64"
            $deps = & $dumpbin /nologo /dependents $f | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() }
            'imports: ' + ($deps -join ', ')
            $crt = $deps | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt-)' }
            Check (-not $crt) "$name imports no VCRUNTIME/MSVCP/UCRT DLL (static CRT)"
          }

          # The MSBuild launcher had no UAC setting: the linker default, asInvoker. Elevation happens
          # at run time (ShellExecuteEx "runas"), so the manifest must not ask for more.
          '--- sc-offline.exe manifest'
          & $mt -nologo "-inputresource:$exe;#1" -out:exe.manifest
          $m = Get-Content exe.manifest -Raw
          $m
          Check ($m -match "requestedExecutionLevel\s+level=['""]asInvoker['""]\s+uiAccess=['""]false['""]") 'sc-offline.exe requestedExecutionLevel asInvoker, uiAccess false (as the MSBuild build)'
          Check ($m -match "name=['""]Microsoft\.Windows\.Common-Controls['""]") 'sc-offline.exe depends on Common-Controls 6 (launcher.cpp manifestdependency)'

          # The optional bridges (SCO_BRIDGE_TITANLINK / SCO_BRIDGE_VOXEL) are off in this build, the one
          # the release packages: their commands must not be in the DLL.
          '--- dinput8.dll without the bridges'
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($dll))
          Check (-not $text.Contains('titanlink.pilot')) 'dinput8.dll has no linked TitanLink module or built-in'
          Check (-not $text.Contains('voxel_bridge.toggle')) 'dinput8.dll has no linked voxel module or built-in'
          Check (-not $text.Contains('multiplayer.host')) 'dinput8.dll excludes unapproved multiplayer/G13'
          Check (-not $text.Contains('inspector.read')) 'dinput8.dll has no inspector built-in or linked fallback'
          # npc.clear / npc.remove_entity are live legacy row names in src/npc.cpp.
          # Exact host registration/linkage absence for all four commands is checked by test_npc_release.py.
          foreach ($cmd in 'npc.spawn', 'npc.observe') {
            Check (-not $text.Contains($cmd)) "dinput8.dll has no $cmd built-in, linked fallback or legacy NPC tab"
          }

          '--- dinput8.dll manifest'
          & $mt -nologo "-inputresource:$dll;#2" -out:dll.manifest
          $d = Get-Content dll.manifest -Raw
          $d
          Check ($d -match '<heapType[^>]*>SegmentHeap</heapType>') 'dinput8.dll manifest heapType SegmentHeap (EnableSegmentHeap)'

          if ($script:failed) { "$($script:failed) check(s) failed"; exit 1 }
          'all checks passed'

      # Release links without debug information, so there is no PDB to upload.
      - name: Upload DLL + launcher artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dinput8-release
          path: |
            build/bin/Release/dinput8.dll
            build/bin/Release/sc-offline.exe
          if-no-files-found: error
          retention-days: 30

      # Test plugins for in-game checks (tools/test-plugins). Never part of a release.
      - name: Upload test plugins
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-plugins
          path: |
            build/test-plugins/*/*.dll
            build/test-plugins/*/plugin.ini
          if-no-files-found: error
          retention-days: 30

  # Bridges and MIT-wire fixture configure independently, never in normal release.
  # G3 requires a future approved SDK; do not revive host-embedded bridges-test builds.

  release:
    needs: [build, inspector-sdk, npc-sdk, contracts-sdk, external-sdk]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download DLL + launcher artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dinput8-release
          path: built

      - name: Download isolated external feature folders
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: external-*-plugin
          path: built-external
          merge-multiple: true

      - name: Download inspector plugin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inspector-plugin
          path: built-inspector

      - name: Download contracts plugin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contracts-plugin
          path: built-contracts

      - name: Download NPC plugin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npc-plugin
          path: built-npc

      # The player download: everything to play, in one folder, with the DLL CI just built.
      # manifest.json (#31) lists every other file in the folder with its SHA-256; the launcher's
      # self-update copies only listed files whose hash matches. Writing it fails when the tag
      # doesn't equal SCO_VERSION in src/version.h. The zip is re-read and checked before upload.
      - name: Package sc-offline-<tag>.zip
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          pkg="sc-offline-$TAG"
          mkdir -p "stage/$pkg"
          cp built/dinput8.dll built/sc-offline.exe "stage/$pkg/"
          cp launcher/sc-offline.ini launcher/sc-offline.sh README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md "stage/$pkg/"
          git ls-files -z docs | xargs -0 -r cp --parents -t "stage/$pkg/"
          git ls-files -z data | xargs -0 cp --parents -t "stage/$pkg/"
          # Ordinary public catalog pack; originals remain user-editable sources.
          mkdir -p "stage/$pkg/data/plugins/picker_catalog/lists"
          cp data/ships.txt data/npcs.txt "stage/$pkg/data/plugins/picker_catalog/lists/"
          # Independent folders; metadata/defaults from matching components.
          for feature in creative discord crew spawn build mining teleport quantum; do
            mkdir -p "stage/$pkg/data/plugins/$feature"
            cp "built-external/$feature/plugin.ini" "built-external/$feature/$feature.dll" "stage/$pkg/data/plugins/$feature/"
            for f in plugin.ini "$feature.dll"; do test -f "stage/$pkg/data/plugins/$feature/$f"; done
          done
          for feature in creative discord; do
            cp "built-external/$feature/disabled" "stage/$pkg/data/plugins/$feature/disabled"
            test -f "stage/$pkg/data/plugins/$feature/disabled"
          done
          cp built-external/mining/import_settings.py "stage/$pkg/data/plugins/mining/import_settings.py"
          test -f "stage/$pkg/data/plugins/mining/import_settings.py"
          for feature in crew spawn build mining teleport quantum; do
            test ! -e "built-external/$feature/disabled"
            test ! -e "stage/$pkg/data/plugins/$feature/disabled"
          done
          # Inspector: published-SDK build, explicitly enabled; no built-in fallback.
          mkdir -p "stage/$pkg/data/plugins/inspector"
          cp built-inspector/inspector/plugin.ini built-inspector/inspector/inspector.dll "stage/$pkg/data/plugins/inspector/"
          for f in plugin.ini inspector.dll; do test -f "stage/$pkg/data/plugins/inspector/$f"; done
          test ! -e "stage/$pkg/data/plugins/inspector/disabled"
          # NPC: published-SDK build, explicitly enabled; no built-in fallback.
          mkdir -p "stage/$pkg/data/plugins/npc"
          cp built-npc/npc/plugin.ini built-npc/npc/npc.dll "stage/$pkg/data/plugins/npc/"
          for f in plugin.ini npc.dll; do test -f "stage/$pkg/data/plugins/npc/$f"; done
          test ! -e "stage/$pkg/data/plugins/npc/disabled"
          # Contracts: published-SDK build, no built-in fallback; refuses in game until providers land.
          mkdir -p "stage/$pkg/data/plugins/contracts"
          cp built-contracts/contracts/plugin.ini built-contracts/contracts/contracts.dll "stage/$pkg/data/plugins/contracts/"
          for f in plugin.ini contracts.dll; do test -f "stage/$pkg/data/plugins/contracts/$f"; done
          test ! -e "stage/$pkg/data/plugins/contracts/disabled"
          chmod +x "stage/$pkg/sc-offline.sh"
          python3 tools/release-manifest.py write "stage/$pkg" --tag "$TAG" --commit "$SHA" --version-h src/version.h
          (cd stage && zip -qrX "../$pkg.zip" "$pkg")
          unzip -l "$pkg.zip" | tail -1
          mkdir roundtrip && unzip -q "$pkg.zip" -d roundtrip
          python3 tools/release-manifest.py check "roundtrip/$pkg"
          echo "ZIP=$pkg.zip" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ env.ZIP }}
            built/dinput8.dll
          generate_release_notes: true
          # v1.x and later publish as full releases; v0.x tags publish as
          # pre-releases. A maintainer may promote one to Latest
          # (`gh release edit <tag> --prerelease=false --latest`) before anyone
          # has played it; the release notes then say it is untested.
          prerelease: ${{ !startsWith(github.ref_name, 'v1.') }}
          body: |
            **Built from this repository's source** — commit `${{ github.sha }}` on
            `${{ github.ref_name }}`.

            **Playing:** download `sc-offline-${{ github.ref_name }}.zip`, extract it, and run
            `sc-offline.exe` (Linux, experimental: `sc-offline.sh`). Do the README's one-time
            Setup first; `sc-offline.exe status` checks it. `dinput8.dll` is attached on its
            own for anyone swapping DLLs.

            Every runtime path in a release is unproven until someone has run it.
            If something breaks, send back the matching lines from `mod.log` and
            `Game.log`.
