name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      qualify_stable_sdk:
        description: 'Qualify the published sco-core SDK 2.4.1 release'
        type: boolean
        default: false
# Default to read; only the release job asks for write.
permissions:
  contents: read

# A newer push to the same branch or PR replaces the running build; tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Qualify the immutable published package independently from the product gitlink.
  stable-host-package:
    if: (github.event_name == 'workflow_dispatch' && inputs.qualify_stable_sdk) || (github.event_name == 'pull_request' && github.event.pull_request.number == 192)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scuba-sc/sco-core
          ref: ef4061b123a1f0b4f449e6c0257078d7348520e3
          path: stable-core
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scuba-sc/sc-offline
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: offline-source
          persist-credentials: false
      - name: Verify the published SDK and package the host kit
        working-directory: stable-core
        env:
          GH_TOKEN: ${{ github.token }}
          OFFLINE_RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QUALIFICATION_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$QUALIFICATION_EVENT" = pull_request ]; then
            test "$(gh api repos/scuba-sc/sc-offline/pulls/192 --jq '.state + ":" + .base.ref + ":" + .head.sha')" = "open:main:$OFFLINE_RUN_SHA"
          fi
          test "$(git -C ../offline-source rev-parse HEAD)" = "$OFFLINE_RUN_SHA"
          test -z "$(git -C ../offline-source status --porcelain)"
          test "$(git -C ../stable-core rev-parse HEAD)" = ef4061b123a1f0b4f449e6c0257078d7348520e3
          git -C ../stable-core fetch origin refs/tags/sdk-v2.4.1-rc.1:refs/tags/sdk-v2.4.1-rc.1
          test "$(git -C ../stable-core rev-parse 'refs/tags/sdk-v2.4.1-rc.1^{commit}')" = ef4061b123a1f0b4f449e6c0257078d7348520e3
          test -z "$(git -C ../stable-core status --porcelain)"
          gh release view sdk-v2.4.1-rc.1 --repo scuba-sc/sco-core --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/release-view.json"
          python3 - "$RUNNER_TEMP/release-view.json" <<'PY'
          import json, sys
          release_view = json.load(open(sys.argv[1], encoding='utf-8'))
          assert release_view['tagName'] == 'sdk-v2.4.1-rc.1'
          assert release_view['isDraft'] is False
          assert release_view['isPrerelease'] is True
          PY
          mkdir -p "$RUNNER_TEMP/stable-assets"
          gh release download sdk-v2.4.1-rc.1 --repo scuba-sc/sco-core --dir "$RUNNER_TEMP/stable-assets"
          cd "$RUNNER_TEMP/stable-assets"
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('.')
          release = json.loads((root / 'release.json').read_text())
          expected = {
              'sco-sdk-2.4.1.zip': '7d17e8671a45129a74b129b4620899ba999d7be783785baa69a8e985a43cb0fd',
              'sco-sdk-core-source-2.4.1.zip': 'e36bb3d70c79d96d038b3f08996ec524c9f5cc7a12064fce431f1fba01a0ac05',
              'sco-sdk-host-source-sc-2.4.1.zip': '80792d67bb5b94ab747aad0b9ca519816f5df96fed5a9afed6cec55d75e2eecc',
          }
          assert release['tag'] == 'sdk-v2.4.1-rc.1'
          assert release['source']['repo'] == 'scuba-sc/sco-core'
          assert release['source']['sha'] == 'ef4061b123a1f0b4f449e6c0257078d7348520e3'
          assert release['builder']['run_id'] == 44964296497
          assets = {item['name']: item for item in release['artifacts']}
          for name, digest in expected.items():
              item = assets[name]
              data = (root / name).read_bytes()
              assert item['sha256'] == digest, name
              assert item['size'] == len(data), name
              assert hashlib.sha256(data).hexdigest() == digest, name
          PY
          mkdir -p "$RUNNER_TEMP/stable-extracted"
          unzip -q sco-sdk-host-source-sc-2.4.1.zip -d "$RUNNER_TEMP/stable-extracted"
          kit="$RUNNER_TEMP/stable-extracted/sco-sdk-host-source-sc-2.4.1"
          (cd "$kit" && sha256sum -c SHA256SUMS)
          python3 - "$kit/COMPATIBILITY.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['profile'] == 'host-source-sc'
          assert data['core_sdk_version'] == '2.4.1'
          assert data['source_commits']['core'] == 'ef4061b123a1f0b4f449e6c0257078d7348520e3'
          assert data['source_commits']['game-sc'] == 'ef4061b123a1f0b4f449e6c0257078d7348520e3'
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-host-source-kit
          path: ${{ runner.temp }}/stable-assets/sco-sdk-host-source-sc-2.4.1.zip
          if-no-files-found: error
          retention-days: 7

  stable-host-consumer:
    if: (github.event_name == 'workflow_dispatch' && inputs.qualify_stable_sdk) || (github.event_name == 'pull_request' && github.event.pull_request.number == 192)
    needs: stable-host-package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
        source: [source, kit]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scuba-sc/sco-core
          ref: ef4061b123a1f0b4f449e6c0257078d7348520e3
          path: stable-core
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stable-host-source-kit
          path: ${{ runner.temp }}/stable-kit
      - name: Verify stable inputs and test actual host reports
        shell: bash
        env:
          INPUT_KIND: ${{ matrix.source }}
        run: |
          set -euo pipefail
          test "$(git -C stable-core rev-parse HEAD)" = ef4061b123a1f0b4f449e6c0257078d7348520e3
          test -z "$(git -C stable-core status --porcelain)"
          workspace="$GITHUB_WORKSPACE"; temp="$RUNNER_TEMP"; py=python3; generator=()
          if [ "$RUNNER_OS" = Windows ]; then
            workspace="$(cygpath -m "$GITHUB_WORKSPACE")"; temp="$(cygpath -m "$RUNNER_TEMP")"; py=python
            generator=(-G 'Visual Studio 18 2026' -A x64)
          else
            export CC=clang CXX=clang++
          fi
          archive="$temp/stable-kit/sco-sdk-host-source-sc-2.4.1.zip"
          "$py" - "$archive" <<'PY'
          import hashlib, sys
          assert hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest() == '80792d67bb5b94ab747aad0b9ca519816f5df96fed5a9afed6cec55d75e2eecc'
          PY
          "$py" -m zipfile -e "$archive" "$temp/stable-extracted"
          kit="$temp/stable-extracted/sco-sdk-host-source-sc-2.4.1"
          "$py" - "$kit/COMPATIBILITY.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['profile'] == 'host-source-sc'
          assert data['source_commits']['core'] == 'ef4061b123a1f0b4f449e6c0257078d7348520e3'
          assert data['source_commits']['game-sc'] == 'ef4061b123a1f0b4f449e6c0257078d7348520e3'
          PY
          source="$workspace/stable-core"
          if [ "$INPUT_KIND" = kit ]; then source="$kit"; fi
          test -f "$source/tests/owned_shutdown_test_access.h"
          (cd "$kit" && sha256sum -c SHA256SUMS)
          cmake -S tools/offline-host -B "$temp/stable-build" "${generator[@]}" -DCMAKE_BUILD_TYPE=Release "-DSCO_HOST_SOURCE_DIR=$source"
          cmake --build "$temp/stable-build" --config Release --target host_report_test --parallel 2
          ctest --test-dir "$temp/stable-build" -C Release --show-only=json-v1 > "$temp/stable-tests.json"
          "$py" - "$temp/stable-tests.json" <<'PY'
          import json, sys
          names = {test['name'] for test in json.load(open(sys.argv[1], encoding='utf-8'))['tests']}
          expected = {f'host_report_{name}' for name in (
              'refusal', 'reentry', 'wrong-thread', 'failed-start',
              'options-copy', 'copy', 'copy-negative', 'retained_reap')}
          assert expected <= names, expected - names
          PY
          ctest --test-dir "$temp/stable-build" -C Release -R '^host_report_' --no-tests=error --output-on-failure

  stable-host-current:
    if: (github.event_name == 'workflow_dispatch' && inputs.qualify_stable_sdk) || (github.event_name == 'pull_request' && github.event.pull_request.number == 192)
    needs: stable-host-consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scuba-sc/sc-offline
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: offline-source
          persist-credentials: false
      - name: Recheck qualification source and stable pin after all four tests
        env:
          GH_TOKEN: ${{ github.token }}
          OFFLINE_RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QUALIFICATION_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$QUALIFICATION_EVENT" = pull_request ]; then
            test "$(gh api repos/scuba-sc/sc-offline/pulls/192 --jq '.state + ":" + .base.ref + ":" + .head.sha')" = "open:main:$OFFLINE_RUN_SHA"
          fi
          test "$(git -C offline-source rev-parse HEAD)" = "$OFFLINE_RUN_SHA"
          test -z "$(git -C offline-source status --porcelain)"

  # Seconds on Linux: parse errors and MSVC C2712 risks fail here, before the Windows build.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # external/sco-core: its headers are parsed with src/. external/sc-creative: the package
          # preflight reads creative's registered commands from its sources.
          submodules: true

      - name: Install clang + mingw-w64 headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang g++-mingw-w64-x86-64-posix

      - name: Test launcher plugin startup snapshot parser
        run: tools/test_launcher_plugin_startup_snapshot.sh

      # Pinned-host parsing remains separate from the exact stable-source check below.
      - name: tools/check.sh (pinned host source)
        run: tools/check.sh

      # A game.* capability name Core does not define is never granted, so the feature is refused in game.
      - name: game.* capability names exist in the pinned Core
        run: |
          python3 tools/check_capability_names.py --self-test
          python3 tools/check_capability_names.py --core external/sco-core
          python3 tools/check_host_wiring.py

      - name: Test harness shutdown retention (pinned host headers)
        run: |
          tools/test_app_stop.sh external/sco-core
          tools/test_menu_widgets_release.sh external/sco-core

      - name: Generate and verify the selected development SDK
        run: tools/ci-dev-sdk-preflight.sh external/sco-core "$RUNNER_TEMP/sdk-development"

      - name: Check consumers against selected development host source
        run: tools/check.sh

      - name: Test gear consumer with source-built development SDK
        run: |
          set -eu
          test -d plugins/gear_presets
          SDK_VERSION=$(cat "$RUNNER_TEMP/sdk-development/sdk-version.txt")
          SDK_INCLUDE="$RUNNER_TEMP/sdk-development/extracted/sco-sdk-$SDK_VERSION/include"
          test -f "$SDK_INCLUDE/scosdk/game/inventory_layout.hpp"
          cmake -S external/sco-core -B "$RUNNER_TEMP/core-development" -DCMAKE_BUILD_TYPE=Release -DSCO_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/core-development" --parallel 2 --target sco_widgets sco_storage sco_host sco_runtime sco_core sco_sqlite
          cmake -S plugins/gear_presets -B "$RUNNER_TEMP/gear-development" -DSCO_SDK_INCLUDE_DIR="$SDK_INCLUDE" -DSCO_GEAR_PRESETS_TESTS=ON -DSCO_CORE_HOST_TEST_ROOT="$GITHUB_WORKSPACE/external/sco-core" -DSCO_CORE_HOST_BUILD_DIR="$RUNNER_TEMP/core-development"
          cmake --build "$RUNNER_TEMP/gear-development" --parallel 2
          for t in gear-presets-model gear-presets-storage gear-presets-workflow; do
            ctest --test-dir "$RUNNER_TEMP/gear-development" -R "^$t$" --no-tests=error --output-on-failure
          done

      - name: Configure spawn and ASOP consumers with source-built development SDK
        run: |
          set -eu
          SDK_VERSION=$(cat "$RUNNER_TEMP/sdk-development/sdk-version.txt")
          SDK_INCLUDE="$RUNNER_TEMP/sdk-development/extracted/sco-sdk-$SDK_VERSION/include"
          test -f tools/asop_selection_workflow_test.cpp
          test -f "$SDK_INCLUDE/sc_asop_selection.h"
          cmake -S plugins/spawn -B "$RUNNER_TEMP/spawn-development" -DSCO_SDK_INCLUDE_DIR="$SDK_INCLUDE" -DSCO_WORKFLOW_TESTS=ON

      - name: Build spawn feature
        run: cmake --build "$RUNNER_TEMP/spawn-development" --target sco-feature-spawn --parallel 2

      - name: Build spawn module
        run: cmake --build "$RUNNER_TEMP/spawn-development" --target sc-offline-spawn --parallel 2

      - name: Build spawn fixture
        run: cmake --build "$RUNNER_TEMP/spawn-development" --target spawn-module-test --parallel 2

      - name: Build ASOP fixture
        run: cmake --build "$RUNNER_TEMP/spawn-development" --target asop-selection-workflow-test --parallel 2

      - name: Test spawn consumer
        run: ctest --test-dir "$RUNNER_TEMP/spawn-development" -R '^spawn-module-workflow$' --no-tests=error --output-on-failure

      - name: Test ASOP consumer
        run: ctest --test-dir "$RUNNER_TEMP/spawn-development" -R '^asop-selection-workflow$' --no-tests=error --output-on-failure

      - name: Test the Vehicles, Crew and NPC pages together (picker fixture)
        run: |
          set -eu
          SDK_VERSION=$(cat "$RUNNER_TEMP/sdk-development/sdk-version.txt")
          SDK_SHA256=$(cat "$RUNNER_TEMP/sdk-development/sdk-sha256.txt")
          SDK_INCLUDE="$RUNNER_TEMP/sdk-development/extracted/sco-sdk-$SDK_VERSION/include"
          cmake -S plugins -B "$RUNNER_TEMP/picker-development" -DSCO_SDK_INCLUDE_DIR="$SDK_INCLUDE" \
            -DSCO_SDK_VERSION="$SDK_VERSION" -DSCO_SDK_SHA256="$SDK_SHA256" \
            -DSCO_SDK_ARCHIVE="$RUNNER_TEMP/sdk-development/first/sco-sdk-$SDK_VERSION.zip" \
            -DSCO_PICKER_TEST=ON -DSCO_WORKFLOW_TESTS=OFF
          cmake --build "$RUNNER_TEMP/picker-development" --target picker-module-test --parallel 2
          ctest --test-dir "$RUNNER_TEMP/picker-development" -R '^picker-module-workflow$' --no-tests=error --output-on-failure

      - name: Restore pinned host source for remaining checks
        run: |
          set -eu
          EMBEDDED_SOURCE="$(git rev-parse HEAD:external/sco-core)"
          git -C external/sco-core checkout --detach "$EMBEDDED_SOURCE"
          test "$(git -C external/sco-core rev-parse HEAD)" = "$EMBEDDED_SOURCE"
          echo "Restored pinned host source $EMBEDDED_SOURCE"

      - name: Legacy fleet stable identity (ASan and UBSan)
        run: |
          python3 tools/test_fleet_identity.py
          python3 tools/test_launcher_allow.py

      - name: SDK proof generator defaults and explicit overrides
        run: |
          python3 tools/test_sdk_generators.py
          python3 tools/test_travel_sdk_generators.py
          python3 tools/test_sdk_windows_generators.py
          python3 tools/test_tutorial_utf8.py

      # The result a built-in command answers (sco-core #12): SCO_FAILED once it ran and failed,
      # SCO_UNAVAILABLE only for a capability this build doesn't have.
      - name: Built-in result tests
        run: |
          set -eu
          c++ -std=c++20 -I src/builtins -I external/sco-core/include tools/builtins_result_test.cpp -o builtins_result_test
          ./builtins_result_test

      - name: Built-in UI ABI boundary tests (ASan and UBSan)
        run: |
          set -eu
          c++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I src/builtins -I external/sco-core/include tools/builtin_ui_boundary_test.cpp -o builtin_ui_boundary_test
          ./builtin_ui_boundary_test

      # G1 admission evidence decision core: any failed or unparseable OS reading is Unknown, never Clear.
      - name: Admission evidence tests
        run: |
          set -eu
          c++ -std=c++20 -I src tools/admission_evidence_test.cpp -o admission_evidence_test
          ./admission_evidence_test

      - name: Host start retry cadence
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -I src tools/start_retry_test.cpp -o start_retry_test
          ./start_retry_test

      - name: Product native activation refusal
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -I external/sco-core/include src/offline_host.cpp tools/offline-host/refusal_test.cpp -o offline_host_refusal_test
          ./offline_host_refusal_test
          ./offline_host_refusal_test exception
          c++ -std=c++20 -Wall -Wextra -Werror -pthread -I src -I external/sco-core/include -DSCO_OFFLINE_G1_HOST tools/inventory_filter_dispatch_test.cpp -o inventory_filter_dispatch_g1
          ./inventory_filter_dispatch_g1
          c++ -std=c++20 -Wall -Wextra -Werror -pthread -I src tools/inventory_filter_dispatch_test.cpp -o inventory_filter_dispatch_no_g1
          ./inventory_filter_dispatch_no_g1
          c++ -std=c++20 -Wall -Wextra -Werror -pthread -I src -I external/sco-core/include -DSCO_OFFLINE_G1_HOST tools/mission_script_route_test.cpp -o mission_script_route_g1
          ./mission_script_route_g1
          c++ -std=c++20 -Wall -Wextra -Werror -pthread -I src tools/mission_script_route_test.cpp -o mission_script_route_no_g1
          ./mission_script_route_no_g1
          c++ -std=c++20 -Wall -Wextra -Werror -I external/sco-core/include -DSCO_OFFLINE_G1_HOST src/offline_host.cpp tools/offline-host/refusal_test.cpp -o inventory_filter_no_owner
          ./inventory_filter_no_owner
          c++ -std=c++20 -Wall -Wextra -Werror -I src -I external/sco-core/include tools/offline-host/capability_refusal_test.cpp -o capability_refusal_test
          ./capability_refusal_test
          python3 tools/test_native_preflight_wiring.py
          python3 tools/test_native_write_census.py
          python3 tools/test_check_package_tree.py
          python3 tools/test_no_host_fallback.py

      - name: Owned signature snapshot diagnostics
        run: |
          cmake -S tools/offline-host -B "$RUNNER_TEMP/offline-owned" -DSCO_HOST_SOURCE_DIR="$GITHUB_WORKSPACE/external/sco-core"
          # Build every registered fixture before running the complete CTest suite.
          cmake --build "$RUNNER_TEMP/offline-owned" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/offline-owned" -N | grep -E 'Test +#[0-9]+: owned_capsule_host$' >/dev/null
          ctest --test-dir "$RUNNER_TEMP/offline-owned" -N | grep -E 'Test +#[0-9]+: owned_capsule_after_app_start$' >/dev/null
          for scenario in inventory_filter_dispatch_g1 inventory_filter_dispatch_no_g1 inventory_filter_no_owner mission_script_route_g1 mission_script_route_no_g1 mission_script_no_owner flight_ready_worker; do
            ctest --test-dir "$RUNNER_TEMP/offline-owned" -N | grep -E "Test +#[0-9]+: ${scenario}$" >/dev/null
          done
          for scenario in refusal reentry wrong-thread failed-start options-copy copy copy-negative retained_reap; do
            ctest --test-dir "$RUNNER_TEMP/offline-owned" -N | grep -E "Test +#[0-9]+: host_report_${scenario}$" >/dev/null
          done
          ctest --test-dir "$RUNNER_TEMP/offline-owned" --no-tests=error --output-on-failure

      - name: ASOP partial-start refusal propagation
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -I external/sco-core/include src/asop_shell.cpp tools/asop-shell/start_failure_test.cpp -o asop_start_failure_test
          ./asop_start_failure_test

      - name: ASOP environment policy (synthetic)
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -I external/sco-core/include tools/asop-shell/environment_test.cpp -o asop_environment_test
          ./asop_environment_test

      - name: ASOP committed selection retry model
        run: |
          c++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pthread -I src tools/asop_selection_notice_test.cpp -o asop_selection_notice_test
          ./asop_selection_notice_test
          c++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -I src tools/asop_selection_notice_test.cpp -o asop_selection_notice_test_asan
          ./asop_selection_notice_test_asan
          c++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pthread -fsanitize=thread -I src tools/asop_selection_notice_test.cpp -o asop_selection_notice_test_tsan
          ./asop_selection_notice_test_tsan

      - name: Host menu opt-in and ASOP fixture gate
        run: |
          test -f tools/asop_selection_workflow_test.cpp
          python3 tools/test_host_menu_gate.py
          python3 tools/test_asop_composition_gate.py

      - name: Headless menu size, tab overflow and sidebar navigation tests
        run: python3 tools/check_menu_window.py

      - name: Plain wording on the menu pages players see
        run: python3 tools/check_menu_wording.py

      - name: Install discovery identity and priority tests
        run: python3 tools/check_install_discovery.py

      - name: Launcher UTF-8 catalogues and headless text checks
        run: python3 tools/check_launcher_localization.py

      - name: Release manifest and NPC external wiring tests
        run: |
          python3 tools/test_release_manifest.py
          python3 tools/test_package_release.py
          python3 tools/test_version_agreement.py
          python3 tools/test_bump_sdk_pin.py
          python3 tools/test_release_gate.py
          python3 tools/test_npc_release.py
          python3 tools/test_external_release.py
          python3 tools/test_release_plugin_profile.py

      # Byte parity alone can bless simultaneous drift: keep an independent immutable source pin.
      - name: Exact ImGui third-party ABI pin and refusal tests
        run: |
          python3 tools/test_imgui_pin.py
          python3 tools/imgui-pin.py

      # The ImGui headers sco-core's SDK ships for plugin UI must be the ones this product links.
      - name: ImGui headers match the SDK's
        run: |
          set -eu
          for f in imconfig.h imgui.h LICENSE.txt; do
            cmp "src/third_party/imgui/$f" "external/sco-core/sdk/third_party/imgui/$f"
          done
          echo "src/third_party/imgui and external/sco-core/sdk/third_party/imgui match"

      - name: Save the exact development SDK for isolated consumer proofs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-sdk-candidate
          path: |
            ${{ runner.temp }}/sdk-development/first/*
            ${{ runner.temp }}/sdk-development/sdk-version.txt
            ${{ runner.temp }}/sdk-development/sdk-sha256.txt
            ${{ runner.temp }}/sdk-development/core-source.sha
          if-no-files-found: error
          retention-days: 7

  development-sdk-proofs:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # external/sc-creative carries the creative plugin and its proof.
          submodules: recursive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: development-sdk-candidate
          path: ${{ runner.temp }}/sdk-development
      - name: Run isolated consumer proofs against selected development Core
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
          "$py" tools/ci-dev-sdk-proofs.py "$RUNNER_TEMP/sdk-development" "$RUNNER_TEMP/development-proofs"

  # Its own job, not a step of `check`: `build` waits for `check`, so a failing scan gate there
  # would also hide whether the sources compile. The two answers are independent. Like every job
  # here it runs on pull requests and on each push to main, so a green main shows the gate holds.
  no-scans:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Zero raw pattern scans under src/
        run: tools/no-scans.sh

  # src/builtins/ is a consumer of the sco SDK: it may include only the SDK zip's public headers and
  # its own files. The header list comes from external/sco-core's sdk/components.json, or its legacy
  # sdk/package.py CONTENT table (hence the submodule);
  # the exceptions, one reason each, are in tools/sdk-headers-allow.txt. Its own job for the same
  # reason as no-scans.
  sdk-headers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: The gate's own tests (manifest and legacy forms, fail-closed)
        run: python3 tools/test_sdk_headers.py

      - name: Built-ins include only SDK headers
        run: python3 tools/sdk-headers.py

  # Historical published-archive compatibility checks. These do not qualify
  # current development host or the development SDK; no release conclusion follows.
  inspector-sdk-posix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published SDK (combined core + game)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download sdk-v2.4.1-rc.1 -R scuba-sc/sco-core -p 'sco-sdk-2.4.1.zip' -p SHA256SUMS -D "$RUNNER_TEMP/sdk-assets"
      - name: Isolated inspector build, full dependency traces, negative controls and checker
        run: python3 tools/check_inspector_sdk.py --archive "$RUNNER_TEMP/sdk-assets/sco-sdk-2.4.1.zip" --sums "$RUNNER_TEMP/sdk-assets/SHA256SUMS" --work "$RUNNER_TEMP/inspector-proof"

  inspector-sdk:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published SDK (combined core + game)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download sdk-v2.4.1-rc.1 -R scuba-sc/sco-core -p 'sco-sdk-2.4.1.zip' -p SHA256SUMS -D "$env:RUNNER_TEMP/sdk-assets"
      - name: Isolated MSVC inspector, module workflow, full dependency traces and checker
        run: python tools/check_inspector_sdk.py --archive "$env:RUNNER_TEMP/sdk-assets/sco-sdk-2.4.1.zip" --sums "$env:RUNNER_TEMP/sdk-assets/SHA256SUMS" --work "$env:RUNNER_TEMP/inspector-proof"
      - name: Upload enabled inspector release folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inspector-plugin
          path: ${{ runner.temp }}/inspector-proof/stage/data/plugins
          if-no-files-found: error
          retention-days: 30

  npc-sdk-posix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published SDK (combined core + game)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download sdk-v2.4.1-rc.1 -R scuba-sc/sco-core -p 'sco-sdk-2.4.1.zip' -p SHA256SUMS -D "$RUNNER_TEMP/sdk-assets"
      - name: Isolated NPC build, lifecycle module test, full dependency traces, negative controls and checker
        run: python3 tools/check_npc_sdk.py --archive "$RUNNER_TEMP/sdk-assets/sco-sdk-2.4.1.zip" --sums "$RUNNER_TEMP/sdk-assets/SHA256SUMS" --work "$RUNNER_TEMP/npc-proof"

  npc-sdk:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published SDK (combined core + game)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download sdk-v2.4.1-rc.1 -R scuba-sc/sco-core -p 'sco-sdk-2.4.1.zip' -p SHA256SUMS -D "$env:RUNNER_TEMP/sdk-assets"
      - name: Isolated MSVC NPC, lifecycle module test, full dependency traces and checker
        run: python tools/check_npc_sdk.py --archive "$env:RUNNER_TEMP/sdk-assets/sco-sdk-2.4.1.zip" --sums "$env:RUNNER_TEMP/sdk-assets/SHA256SUMS" --work "$env:RUNNER_TEMP/npc-proof"
      - name: Upload enabled NPC release folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npc-plugin
          path: ${{ runner.temp }}/npc-proof/stage/data/plugins
          if-no-files-found: error
          retention-days: 30

  # Loadout proofs. The Windows job uploads the enabled loadout plugin folder, which the release job stages
  # (the player-offline profile ships it enabled; its lists are staged by tools/package_release.py).
  loadout-sdk-posix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published SDK (combined core + game)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download sdk-v2.4.1-rc.1 -R scuba-sc/sco-core -p 'sco-sdk-2.4.1.zip' -p SHA256SUMS -D "$RUNNER_TEMP/sdk-assets"
      - name: Validate Loadout module workflows, sanitizers and public dependency boundaries
        run: python3 tools/check_loadout_sdk.py --archive "$RUNNER_TEMP/sdk-assets/sco-sdk-2.4.1.zip" --sums "$RUNNER_TEMP/sdk-assets/SHA256SUMS" --work "$RUNNER_TEMP/loadout-proof"

  loadout-sdk:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published SDK (combined core + game)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download sdk-v2.4.1-rc.1 -R scuba-sc/sco-core -p 'sco-sdk-2.4.1.zip' -p SHA256SUMS -D "$env:RUNNER_TEMP/sdk-assets"
      - name: Validate MSVC Loadout module workflows and public dependency traces
        run: python tools/check_loadout_sdk.py --archive "$env:RUNNER_TEMP/sdk-assets/sco-sdk-2.4.1.zip" --sums "$env:RUNNER_TEMP/sdk-assets/SHA256SUMS" --work "$env:RUNNER_TEMP/loadout-proof"
      - name: Upload enabled loadout release folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loadout-plugin
          path: ${{ runner.temp }}/loadout-proof/stage/data/plugins
          if-no-files-found: error
          retention-days: 30

  install-aliases:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install discovery with real directory junctions and hardlinked binaries
        run: python tools/check_install_discovery.py

  install-aliases-wine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Wine and MinGW
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wine64 wine g++-mingw-w64-x86-64-posix xvfb xauth
      - name: 'Install discovery with real Wine C:/Z: aliases'
        run: xvfb-run -a python3 tools/check_install_discovery_wine.py

  launcher-localization:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Launcher UTF-8 text, glyphs and atomic language settings
        run: python tools/check_launcher_localization.py

  # Rust launcher. Builds the whole workspace (CLI sc-offline, window, updater, plugin manager, in-game
  # menu DLL) with the pinned toolchain, runs the unit and flow tests, checks that the release exes import
  # no dynamic CRT and no network library but WinHTTP, runs the dependency gate, then compares the Rust
  # exe with a C++ sc-offline.exe built from the same source (status and dry-run text, exit codes, file
  # trees) and runs the real helper process and named events against a stand-in game process.
  # Source, build and synthetic evidence only: nothing here runs in game.
  # Not in CI (run by hand, see docs/rust-launcher.md): the C++ update contract (needs a C++ build with
  # -DSCO_UPDATE_TEST), the creative plugin proof (needs the plugins-index tools and a built creative.dll)
  # and the in-game menu host (needs a Core checkout with sco/widgets_view.h).
  rust-launcher:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        working-directory: launcher-rs
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Capability table is current and its wording is honest
        working-directory: .
        run: python tools/capabilities.py --core external/sco-core --check
      - name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt --target x86_64-pc-windows-msvc
          cargo --version
      - name: Clippy, warnings are errors
        run: cargo clippy --workspace --all-targets -- -D warnings
      # tools/build_rust_release.py is the release build: `cargo build --locked --release --workspace` with the
      # cargo home, toolchain, workspace and target folder remapped out of the binaries, then a scan of both
      # release files for build-machine paths. The binaries land in target/release (used by the steps below)
      # and are copied to RUNNER_TEMP/rust-release for the upload.
      - name: Build every crate (release, locked, build-machine paths remapped)
        shell: bash
        run: python ../tools/build_rust_release.py --target-dir target --out "$RUNNER_TEMP/rust-release"
      - name: Test every crate (locked)
        run: cargo test --locked --workspace
      - name: Window self test (no window, no GPU; fixture index and TEST key, never a release build)
        run: cargo run --locked -p scol-ui --features fixtures -- --ui-self-test
      - name: Build the C++ launcher from the same source for the parity checks
        working-directory: .
        shell: pwsh
        run: |
          cmake -S . -B build-cpp -G "Visual Studio 18 2026" -A x64
          cmake --build build-cpp --config Release --target sc-offline --parallel
      - name: Status and dry-run play match the C++ launcher; stand-in game with the real helper
        working-directory: .
        shell: pwsh
        env:
          SCOL_SCRATCH: ${{ runner.temp }}\scol-scratch
        run: |
          New-Item -ItemType Directory -Force $env:SCOL_SCRATCH | Out-Null
          $rs = "launcher-rs/target/release"
          python launcher-rs/tests/status/compare_status.py --cpp build-cpp/bin/Release/sc-offline.exe --rust "$rs/sc-offline.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python launcher-rs/tests/play/compare_dryrun.py --cpp build-cpp/bin/Release/sc-offline.exe --rust "$rs/sc-offline.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python launcher-rs/tests/play/real_standin.py --rust "$rs/sc-offline.exe" --standin "$rs/scol-play-standin.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and uninstall match the C++ launcher
        working-directory: .
        shell: pwsh
        env:
          SCOL_SCRATCH: ${{ runner.temp }}\scol-scratch
        run: |
          New-Item -ItemType Directory -Force $env:SCOL_SCRATCH | Out-Null
          cargo build --locked --release --manifest-path launcher-rs/Cargo.toml -p scol-install --example install_probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python launcher-rs/tests/install/compare.py --cpp build-cpp/bin/Release/sc-offline.exe --rust launcher-rs/target/release/examples/install_probe.exe --work "$env:SCOL_SCRATCH\install-parity"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: The Rust launcher reports the version of src/version.h
        working-directory: .
        shell: pwsh
        run: |
          $ver = (Select-String -Path src/version.h -Pattern '^#define\s+SCO_VERSION\s+"([^"]+)"').Matches[0].Groups[1].Value
          $first = (& "launcher-rs/target/release/sc-offline.exe" help | Select-Object -First 1)
          $first
          if ($first -notlike "sc-offline launcher $ver (*") { throw "sc-offline.exe says '$first', src/version.h says $ver" }
      - name: MCP stdio session against the Rust exe (answers, redacts, writes nothing)
        working-directory: .
        shell: pwsh
        run: |
          python tools/check_launcher_mcp.py --exe launcher-rs/target/release/sc-offline.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Plugin zip corpus matches its generator
        working-directory: .
        run: python launcher-rs/tests/zip-corpus/generate.py --check
      - name: C++ launcher still matches the golden contract files the Rust crates load
        working-directory: .
        run: python tools/check_launcher_contract.py
      - name: No dynamic CRT import in the release exe
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found: the VC tools component is missing on this runner' }
          foreach ($exe in 'scol-hello.exe', 'sc-offline.exe', 'scol-pm.exe', 'sc_offline_menu.dll') {
            $out = & $dumpbin /dependents "target\release\$exe"
            $out
            if ($out -match '(?i)vcruntime|ucrtbase|msvcp|api-ms-win-crt') { throw "dynamic CRT import found in $exe" }
          }
          # WinHTTP is the one network library (the updater and the catalogue); none in scol-hello, scol-pm or the menu.
          foreach ($exe in 'scol-hello.exe', 'scol-pm.exe', 'sc_offline_menu.dll') {
            $out = & $dumpbin /dependents "target\release\$exe"
            if ($out -match '(?i)winhttp|wininet|ws2_32|wsock32') { throw "network library import found in $exe" }
          }
      - name: Dependency gate (cargo-deny)
        run: |
          # Slow (builds from source), pinned to the version tested locally.
          cargo install cargo-deny --locked --version 0.21.0
          cargo deny check
      # The two files the release package takes from this job: the launcher and the opt-in Rust menu.
      - name: Upload the Rust launcher and menu
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-launcher-release
          path: |
            ${{ runner.temp }}/rust-release/sc-offline.exe
            ${{ runner.temp }}/rust-release/sc_offline_menu.dll
          if-no-files-found: error
          retention-days: 30

  # The read-only MCP server (`sc-offline.exe mcp`): protocol, tools and redaction over a fake platform; headless.
  # The stdio proof against a built launcher (`--exe`, which also proves the server writes nothing) runs in the
  # job that builds sc-offline.exe, after "Verify binaries": this job builds no launcher.
  launcher-mcp:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: MCP protocol, tool schemas, log limits and redaction
        run: python tools/check_launcher_mcp.py

  # Contracts: the built-in is gone (G1 refuses builtin inputs with early DataCore), so its
  # published-SDK proof is what stands between the feature and shipping nothing. Refuses in game
  # until the missions/economy providers land; no built-in fallback, no host-side tick.
  contracts-sdk:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published SDK (combined core + game)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download sdk-v2.4.1-rc.1 -R scuba-sc/sco-core -p 'sco-sdk-2.4.1.zip' -p SHA256SUMS -D "$env:RUNNER_TEMP/sdk-assets"
      - name: Isolated MSVC contracts build, read-slice module workflow, full dependency traces and checker
        run: python tools/contracts_sdk_check.py --archive "$env:RUNNER_TEMP/sdk-assets/sco-sdk-2.4.1.zip" --sums "$env:RUNNER_TEMP/sdk-assets/SHA256SUMS" --work "$env:RUNNER_TEMP/contracts-proof" --slice read
      - name: Upload enabled contracts release folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contracts-plugin
          path: ${{ runner.temp }}/contracts-proof/stage/data/plugins
          if-no-files-found: error
          retention-days: 30

  # Proofs: check_discord_sdk.py, check_crew_sdk.py, check_spawn_sdk.py, check_build_sdk.py,
  # check_teleport_sdk.py, check_quantum_sdk.py. Creative is proved by its own job below.
  # Isolated native features; checker and compiler traces use published archives only.
  # Every external plugin consumes the one published SDK 2.4.1 stable release.
  # The archive basename and tag carry the same SDK version.
  external-sdk:
    strategy:
      fail-fast: false
      matrix:
        # mining requires the newly published game SDK; the old pin must refuse, not fall back.
        feature: [discord, crew, spawn, build, mining, teleport, quantum]
    runs-on: windows-2025-vs2026
    env:
      SDK_VERSION: '2.4.1'
      SDK_TAG: 'sdk-v2.4.1-rc.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$env:SDK_TAG" -R scuba-sc/sco-core -p "sco-sdk-$env:SDK_VERSION.zip" -p SHA256SUMS -D "$env:RUNNER_TEMP/sdk-assets"
      - name: Build, test, check and stage independent feature
        env:
          FEATURE: ${{ matrix.feature }}
        run: python "tools/check_${env:FEATURE}_sdk.py" --archive "$env:RUNNER_TEMP/sdk-assets/sco-sdk-$env:SDK_VERSION.zip" --sums "$env:RUNNER_TEMP/sdk-assets/SHA256SUMS" --work "$env:RUNNER_TEMP/feature-proof"
      - name: Upload published-SDK release folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-${{ matrix.feature }}-plugin
          path: ${{ runner.temp }}/feature-proof/stage/data/plugins
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  # Creative is its own repository, the external/sc-creative submodule. Its proof runs from the
  # pinned checkout, before the folder is staged, and uploads the folder under the same artifact
  # name the release job already collects (external-*-plugin).
  creative-sdk:
    runs-on: windows-2025-vs2026
    env:
      SDK_VERSION: '2.4.1'
      SDK_TAG: 'sdk-v2.4.1-rc.1'
      # sc-creative's own default pin is an older published SDK. The product names the SDK it pins:
      # the archive hash and the source commit below are checked against the downloaded archive.
      SDK_SHA256: '7d17e8671a45129a74b129b4620899ba999d7be783785baa69a8e985a43cb0fd'
      SDK_SOURCE: 'ef4061b123a1f0b4f449e6c0257078d7348520e3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Download published SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$env:SDK_TAG" -R scuba-sc/sco-core -p "sco-sdk-$env:SDK_VERSION.zip" -p SHA256SUMS -D "$env:RUNNER_TEMP/sdk-assets"
      - name: Build, test, check and stage creative from the submodule
        run: python external/sc-creative/tools/check_creative_sdk.py --archive "$env:RUNNER_TEMP/sdk-assets/sco-sdk-$env:SDK_VERSION.zip" --sums "$env:RUNNER_TEMP/sdk-assets/SHA256SUMS" --work "$env:RUNNER_TEMP/feature-proof" --candidate --sdk-version "$env:SDK_VERSION" --sdk-sha256 "$env:SDK_SHA256" --archive-sha256 "$env:SDK_SHA256" --sdk-source "$env:SDK_SOURCE" --sdk-profile legacy
      - name: Upload published-SDK release folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-creative-plugin
          path: ${{ runner.temp }}/feature-proof/stage/data/plugins
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  build:
    needs: check
    # Pinned: the project builds with the v145 toolset, which this image carries (VS 2026).
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # external/sco-core is built into dinput8.dll.
          submodules: true

      # Two game DLLs from one configure: dinput8.dll with SCO_HOST_MENU_CLIENT=OFF (the configuration every
      # build run in game used; the default install) and dinput8-rust-menu.dll, the same sources with the menu
      # client and the Rust menu hook (SCO_BUILD_RUST_MENU_HOST, never run in game).
      - name: Configure (x64)
        run: |
          cmake --version
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DSCO_HOST_MENU_CLIENT=OFF -DSCO_BUILD_RUST_MENU_HOST=ON

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Test pinned host ownership fixtures (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = git rev-parse HEAD:external/sco-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = git -C external/sco-core rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($expected -ne $actual) { throw 'Host source differs from the product gitlink' }
          cmake -S tools/offline-host -B "$env:RUNNER_TEMP/offline-owned" -G 'Visual Studio 18 2026' -A x64 "-DSCO_HOST_SOURCE_DIR=$env:GITHUB_WORKSPACE/external/sco-core"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/offline-owned" --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testJson = ctest --test-dir "$env:RUNNER_TEMP/offline-owned" -C Release --show-only=json-v1 | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testList = $testJson | ConvertFrom-Json
          $names = @($testList.tests | ForEach-Object { $_.name })
          foreach ($required in @('asop_selection_file_production', 'asop_selection_file_fault', 'owned_capsule_host', 'owned_capsule_after_app_start', 'native_activation_refusal', 'product_registry_refusal', 'inventory_filter_dispatch_g1', 'inventory_filter_dispatch_no_g1', 'inventory_filter_no_owner', 'mission_script_route_g1', 'mission_script_route_no_g1', 'mission_script_no_owner', 'flight_ready_worker', 'host_report_refusal', 'host_report_reentry', 'host_report_wrong-thread', 'host_report_failed-start', 'host_report_options-copy', 'host_report_copy', 'host_report_copy-negative', 'host_report_retained_reap')) {
            if ($required -notin $names) { throw "Missing required fixture: $required" }
          }
          ctest --test-dir "$env:RUNNER_TEMP/offline-owned" -C Release --no-tests=error --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The properties players and the release depend on, read from the binaries themselves.
      # dumpbin and mt come from the image's VS 2026 and Windows SDK.
      - name: Verify binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'build/bin/Release'
          $dll = "$dir/dinput8.dll"; $exe = "$dir/sc-offline.exe"; $rustDll = "$dir/dinput8-rust-menu.dll"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin -or -not $mt) { throw "dumpbin ($dumpbin) or mt ($mt) not found" }
          $script:failed = 0
          function Check([bool]$ok, [string]$what) {
            if ($ok) { "PASS  $what" } else { "FAIL  $what"; $script:failed++ }
          }

          '--- dinput8.dll exports'
          $exports = & $dumpbin /nologo /exports $dll
          $exports | Select-String 'DirectInput8Create|number of functions|number of names' | ForEach-Object { $_.Line.Trim() }
          Check ([bool]($exports -match '^\s*1\s+\S+\s+DirectInput8Create \(forwarded to C:\\Windows\\System32\\dinput8\.DirectInput8Create\)')) 'dinput8.dll exports DirectInput8Create (ordinal 1), forwarded to System32 dinput8'

          '--- dinput8-rust-menu.dll exports'
          $rustExports = & $dumpbin /nologo /exports $rustDll
          Check ([bool]($rustExports -match '^\s*1\s+\S+\s+DirectInput8Create \(forwarded to C:\\Windows\\System32\\dinput8\.DirectInput8Create\)')) 'dinput8-rust-menu.dll exports DirectInput8Create (ordinal 1), forwarded to System32 dinput8'

          foreach ($f in $dll, $rustDll, $exe) {
            $name = Split-Path $f -Leaf
            "--- $name"
            $machine = (& $dumpbin /nologo /headers $f | Select-String 'machine \(' | Select-Object -First 1).Line.Trim()
            $machine
            Check ($machine -match '^8664 machine \(x64\)$') "$name is machine x64"
            $deps = & $dumpbin /nologo /dependents $f | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() }
            'imports: ' + ($deps -join ', ')
            $crt = $deps | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt-)' }
            Check (-not $crt) "$name imports no VCRUNTIME/MSVCP/UCRT DLL (static CRT)"
          }

          # The MSBuild launcher had no UAC setting: the linker default, asInvoker. Elevation happens
          # at run time (ShellExecuteEx "runas"), so the manifest must not ask for more.
          '--- sc-offline.exe manifest'
          & $mt -nologo "-inputresource:$exe;#1" -out:exe.manifest
          $m = Get-Content exe.manifest -Raw
          $m
          Check ($m -match "requestedExecutionLevel\s+level=['""]asInvoker['""]\s+uiAccess=['""]false['""]") 'sc-offline.exe requestedExecutionLevel asInvoker, uiAccess false (as the MSBuild build)'
          Check ($m -match "name=['""]Microsoft\.Windows\.Common-Controls['""]") 'sc-offline.exe depends on Common-Controls 6 (launcher.cpp manifestdependency)'

          # The optional bridges (SCO_BRIDGE_TITANLINK / SCO_BRIDGE_VOXEL) are off in this build, the one
          # the release packages: their commands must not be in the DLL.
          '--- dinput8.dll without the bridges'
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($dll))
          Check (-not $text.Contains('titanlink.pilot')) 'dinput8.dll has no linked TitanLink module or built-in'
          Check (-not $text.Contains('voxel_bridge.toggle')) 'dinput8.dll has no linked voxel module or built-in'
          Check (-not $text.Contains('multiplayer.host')) 'dinput8.dll excludes unapproved multiplayer/G13'
          Check (-not $text.Contains('inspector.read')) 'dinput8.dll has no inspector built-in or linked fallback'
          # npc.clear / npc.remove_entity are live legacy row names in src/npc.cpp.
          # Exact host registration/linkage absence for all four commands is checked by test_npc_release.py.
          foreach ($cmd in 'npc.spawn', 'npc.observe') {
            Check (-not $text.Contains($cmd)) "dinput8.dll has no $cmd built-in, linked fallback or legacy NPC tab"
          }

          # The split: dinput8.dll is the SCO_HOST_MENU_CLIENT=OFF build and has no Rust menu hook; the Rust menu
          # DLL has it. The hook loads sc_offline_menu.dll by name (a wide path and ASCII log text).
          '--- the two game DLLs differ by the Rust menu hook'
          $rustBytes = [IO.File]::ReadAllBytes($rustDll)
          $classicBytes = [IO.File]::ReadAllBytes($dll)
          function Names-Menu([byte[]]$bytes) {
            $ascii = [Text.Encoding]::ASCII.GetString($bytes)
            $wide = [Text.Encoding]::Unicode.GetString($bytes) + [Text.Encoding]::Unicode.GetString($bytes, 1, $bytes.Length - 1)
            return $ascii.Contains('sc_offline_menu.dll') -or $wide.Contains('sc_offline_menu.dll')
          }
          Check (-not (Names-Menu $classicBytes)) 'dinput8.dll (SCO_HOST_MENU_CLIENT=OFF) does not name sc_offline_menu.dll'
          Check (Names-Menu $rustBytes) 'dinput8-rust-menu.dll names sc_offline_menu.dll (Rust menu hook compiled in)'
          Check ((Get-FileHash $dll).Hash -ne (Get-FileHash $rustDll).Hash) 'the two game DLLs are different builds'
          $rustText = [Text.Encoding]::ASCII.GetString($rustBytes)
          foreach ($needle in 'titanlink.pilot', 'voxel_bridge.toggle', 'multiplayer.host', 'inspector.read', 'npc.spawn', 'npc.observe') {
            Check (-not $rustText.Contains($needle)) "dinput8-rust-menu.dll has no $needle (same exclusions as dinput8.dll)"
          }

          '--- dinput8.dll manifest'
          & $mt -nologo "-inputresource:$dll;#2" -out:dll.manifest
          $d = Get-Content dll.manifest -Raw
          $d
          Check ($d -match '<heapType[^>]*>SegmentHeap</heapType>') 'dinput8.dll manifest heapType SegmentHeap (EnableSegmentHeap)'

          if ($script:failed) { "$($script:failed) check(s) failed"; exit 1 }
          'all checks passed'

      # The built launcher's read-only MCP server over stdio, in a scratch install: answers, redacts, writes nothing.
      - name: Launcher MCP stdio proof
        shell: pwsh
        run: |
          python tools/check_launcher_mcp.py --exe build/bin/Release/sc-offline.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Release links without debug information, so there is no PDB to upload.
      # The C++ sc-offline.exe is the classic fallback: the release ships it as sc-offline-classic.exe
      # beside the Rust sc-offline.exe (tools/package_release.py renames it).
      - name: Upload DLL + classic launcher artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dinput8-release
          path: |
            build/bin/Release/dinput8.dll
            build/bin/Release/dinput8-rust-menu.dll
            build/bin/Release/sc-offline.exe
          if-no-files-found: error
          retention-days: 30

      # Test plugins for in-game checks (tools/test-plugins). Never part of a release.
      - name: Upload test plugins
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-plugins
          path: |
            build/test-plugins/*/*.dll
            build/test-plugins/*/plugin.ini
          if-no-files-found: error
          retention-days: 30

  # Bridges and MIT-wire fixture configure independently, never in normal release.
  # G3 requires a future approved SDK; do not revive host-embedded bridges-test builds.

  release:
    needs: [build, rust-launcher, development-sdk-proofs, inspector-sdk, npc-sdk, contracts-sdk, loadout-sdk, external-sdk, creative-sdk]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # tools/check_package_tree.py reads the creative plugin's commands from external/sc-creative.
          submodules: true
      # The tag is the version: v<SCO_VERSION> (v0.8.0-rc.1 for SCO_VERSION 0.8.0-rc.1), and the Rust
      # workspace carries the same version. tools/package_release.py refuses a different tag too; this stops
      # the job before the package is built.
      - name: The tag, src/version.h and the Rust version agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/test_version_agreement.py
      # The plugins in the package are built from the published SDK that tools/check_inspector_sdk.py pins,
      # and the game DLLs from the Core at the external/sco-core gitlink. Those must be the same SDK:
      # the gitlink commit has to be the commit of that SDK's release tag, the Core there has to say the
      # same version, and the release has to be published (not a draft).
      # A final product tag (v0.8.0) needs the final SDK tag sdk-v<version>, published as a full release.
      # A release-candidate product tag (v0.8.0-rc.1) may instead pin a candidate sdk-v<version>-rc.<n>
      # (the archives of both carry the plain version), published as a pre-release. The pairing and the
      # release state are decided by tools/check_release_gate.py (tested by tools/test_release_gate.py).
      # Until then there is nothing safe to package, so the job stops here.
      - name: Refuse packaging unless Core is a published SDK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sdk_version=$(python3 -c "import sys; sys.path.insert(0, 'tools'); from check_inspector_sdk import SDK_VERSION; print(SDK_VERSION)")
          sdk_tag=$(python3 tools/bump_sdk_pin.py --print-tag)
          fail() { echo "Not packaging: $1" >&2; exit 1; }
          python3 tools/check_release_gate.py --product-tag "$GITHUB_REF_NAME" --sdk-tag "$sdk_tag" --sdk-version "$sdk_version" > "$RUNNER_TEMP/sdk-kind.txt" \
            || exit 1
          python3 tools/bump_sdk_pin.py --check > "$RUNNER_TEMP/pin-check.txt" \
            || { cat "$RUNNER_TEMP/pin-check.txt" >&2; fail "the SDK pins in the repository do not all name SDK $sdk_version ($sdk_tag)."; }
          gitlink=$(git rev-parse HEAD:external/sco-core)
          git -C external/sco-core fetch --no-tags origin "refs/tags/$sdk_tag:refs/tags/$sdk_tag" \
            || fail "the tag $sdk_tag does not exist in scuba-sc/sco-core. Publish SDK $sdk_version first."
          tag_commit=$(git -C external/sco-core rev-parse "refs/tags/$sdk_tag^{commit}")
          [ "$gitlink" = "$tag_commit" ] \
            || fail "external/sco-core is at $gitlink, but $sdk_tag is $tag_commit. Move the Core pin to the tagged commit."
          [ "$(tr -d '[:space:]' < external/sco-core/sdk/VERSION)" = "$sdk_version" ] \
            || fail "the Core at external/sco-core says SDK $(tr -d '[:space:]' < external/sco-core/sdk/VERSION), but the plugins are pinned to SDK $sdk_version."
          state=$(gh release view "$sdk_tag" --repo scuba-sc/sco-core --json isDraft,isPrerelease --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease)"') \
            || fail "$sdk_tag has no published release in scuba-sc/sco-core."
          python3 tools/check_release_gate.py --product-tag "$GITHUB_REF_NAME" --sdk-tag "$sdk_tag" --sdk-version "$sdk_version" --state "$state" > /dev/null \
            || exit 1
          echo "external/sco-core is $gitlink, the published $sdk_tag ($(cat "$RUNNER_TEMP/sdk-kind.txt"), SDK $sdk_version) for $GITHUB_REF_NAME."

      - name: Download DLL + classic launcher artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dinput8-release
          path: built

      - name: Download the Rust launcher and menu artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-launcher-release
          path: built-rust

      - name: Download isolated external feature folders
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: external-*-plugin
          path: built-external
          merge-multiple: true

      - name: Download inspector plugin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inspector-plugin
          path: built-inspector

      - name: Download contracts plugin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contracts-plugin
          path: built-contracts

      - name: Download NPC plugin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npc-plugin
          path: built-npc

      - name: Download loadout plugin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: loadout-plugin
          path: built-loadout

      # The player download: everything to play, in one folder, with the DLL CI just built.
      # tools/package_release.py assembles it (the same script builds a package by hand, see docs/build.md):
      # the Rust launcher as sc-offline.exe, the C++ launcher as sc-offline-classic.exe, the Rust menu
      # sc_offline_menu.dll, dinput8.dll, the ini, docs, data and the player-offline plugin profile.
      # manifest.json (#31) lists every other file in the folder with its SHA-256; the launcher's
      # self-update copies only listed files whose hash matches. Writing it fails when the tag
      # doesn't equal SCO_VERSION in src/version.h. The zip is re-read and checked before upload,
      # and tools/check_package_tree.py inspects the staged folder.
      - name: Package sc-offline-<tag>.zip
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          python3 tools/package_release.py --tag "$TAG" --commit "$SHA" --out stage \
            --rust-exe built-rust/sc-offline.exe --classic-exe built/sc-offline.exe \
            --menu-dll built-rust/sc_offline_menu.dll --dinput8 built/dinput8.dll \
            --dinput8-rust-menu built/dinput8-rust-menu.dll \
            --artifact-root . --profile player-offline --check-tree
          echo "ZIP=stage/sc-offline-$TAG.zip" >> "$GITHUB_ENV"

      # A release candidate (tag with -rc.<n>, for example v0.8.0-rc.1) is always a pre-release and never
      # Latest, so the stable update channel does not offer it. Testers download the zip from its page; the
      # pre-release channel offers it to launchers that opted in.
      - name: Create Release (release candidate)
        if: contains(github.ref_name, '-rc.')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ env.ZIP }}
            built/dinput8.dll
          generate_release_notes: true
          prerelease: true
          make_latest: false
          body: |
            **Release candidate for testers. This is not the final release.** Built from this
            repository's source: commit `${{ github.sha }}` on `${{ github.ref_name }}`.

            The stable update channel does not offer it, so nobody is moved to it by accident. It is
            here so that people can try it before the final release is made. Fixes go into another
            candidate or into the final release.

            **Get it:** download `sc-offline-${{ github.ref_name }}.zip` on this page, extract it into
            its own folder and run `sc-offline.exe`. Do the README's one-time Setup first;
            `sc-offline.exe status` checks it. `sc-offline.exe` is the Rust launcher; the C++ launcher
            is in the zip as `sc-offline-classic.exe`, the fallback. The Rust in-game menu is opt-in
            (`menu = rust` in `sc-offline.ini`). From a 0.7.x launcher, set
            `update_channel = prerelease` in `sc-offline.ini` and run `sc-offline.exe update`.

            **Test first:** in this order, and stop at the first thing that fails.
            1. `sc-offline.exe status`: it should find the game and show no leftover PC change.
            2. Play with the default menu (`menu = imgui`): the game starts, the menu opens on M,
               and equipping gear from the Gear page attaches the items. Then close the game and run
               `sc-offline.exe status` again.
            3. The classic launcher, `sc-offline-classic.exe play`.
            4. The new menu (`menu = rust`).

            **Report:** open an issue on this repository. Say which candidate (`${{ github.ref_name }}`),
            what you did, what you expected and what happened. Add the matching lines from `mod.log`
            and `Game.log` and the output of `sc-offline.exe status`. Leave out anything personal.

            **Go back:** run `sc-offline-classic.exe uninstall` (or `sc-offline.exe uninstall`). It
            takes the mod out of the game folder and undoes the PC changes. Then download the 0.7.7
            zip from the releases page and extract it into a folder. `sc-offline.ini` and `data\`
            (wallet, saved places) can be kept.

            Not run in game. Every runtime path in this candidate is unproven until someone has run it.
      - name: Create Release
        if: ${{ !contains(github.ref_name, '-rc.') }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ env.ZIP }}
            built/dinput8.dll
          generate_release_notes: true
          # v1.x and later publish as full releases; v0.x tags publish as
          # pre-releases. A maintainer may promote one to Latest
          # (`gh release edit <tag> --prerelease=false --latest`) before anyone
          # has played it; the release notes then say it is untested.
          prerelease: ${{ contains(github.ref_name, '-rc.') || !startsWith(github.ref_name, 'v1.') }}
          body: |
            **Built from this repository's source** — commit `${{ github.sha }}` on
            `${{ github.ref_name }}`.

            **Playing:** download `sc-offline-${{ github.ref_name }}.zip`, extract it, and run
            `sc-offline.exe` (Linux, experimental: `sc-offline.sh`). Do the README's one-time
            Setup first; `sc-offline.exe status` checks it. `sc-offline.exe` is the Rust launcher;
            the C++ launcher is in the zip as `sc-offline-classic.exe`, the fallback. The Rust
            in-game menu is opt-in (`menu = rust` in `sc-offline.ini`). `dinput8.dll` is attached
            on its own for anyone swapping DLLs.

            Every runtime path in a release is unproven until someone has run it.
            If something breaks, send back the matching lines from `mod.log` and
            `Game.log`.
