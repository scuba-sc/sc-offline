id = titanlink
name = TitanLink (optional local bridge)
version = 0.1.0
author = scubamount
api = 1.1
kind = native
entry = titanlink.dll

[settings]
game = string default "C:/Program Files (x86)/Steam/steamapps/common/Titanfall2" label "Titanfall 2 folder"
map = string default "mp_coliseum" label "Local match map"
mode = string default "tdm" label "Local match mode"
extra = string default "" label "Northstar launch arguments"
fov = float default 0 min 0 max 169 label "Vertical FOV (0 uses 60; cl_fov unavailable)"
launch = bool default true label "Launch EA/Northstar only on explicit pilot request"
