 ; Optional local bridge; disabled marker is installed and never removed by this build.
id = voxel_bridge
name = Voxel bridge
version = 1.0.0
author = scubamount
api = 1.1
kind = native
entry = voxel_bridge.dll

[settings]
block = string default "CargoBox_050x050x050_Metal" label "Crate class (none disables crates)"
size = float default 0.5 min 0.1 max 4 label "Metres per block"
pivot = float default 0 min -1 max 1 label "Crate origin within block"
radius = int default 2 min 1 max 4 label "Ground scan radius (8x8 regions)"
