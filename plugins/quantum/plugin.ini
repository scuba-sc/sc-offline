id = quantum
name = Quantum control, Travel and bookmarks
version = 1.0.0
author = sc-offline
api = 1.1
kind = native
entry = quantum.dll

[settings]
caps_input = bool default true label "Hold Caps Lock for bounded boost" help "Only after explicit quantum.enable; focused game process only"
mouse_input = bool default false label "Opt-in primary mouse hold" help "Only after explicit enable; no NAV-mode inference. Leave off for normal firing."
data_root = string default "data" label "Legacy data root"
spawn_file = string default "" label "Legacy quick-save file" help "Empty uses launcher SC_OFFLINE_SPAWN_FILE, then data_root/spawn.txt"
