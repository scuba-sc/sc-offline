id = quantum
name = Travel and quantum drive
version = 1.0.0
author = sc-offline
api = 1.1
kind = native
entry = quantum.dll

[settings]
relocation = bool default true label "Allow moving the player (offline only)" help "Turn this off to keep the player in place. Boost and saving spots still work."
caps_input = bool default true label "Hold Caps Lock to boost" help "Works only after you turn the quantum drive controls on, and only while the game window is in front."
mouse_input = bool default false label "Hold the left mouse button to boost" help "Works only after you turn the quantum drive controls on. Leave off so firing weapons does not boost."
data_root = string default "data" label "Data folder"
spawn_file = string default "" label "Saved spot file" help "Where the quick-saved spot is kept if no database is available. Leave empty for the default."
