id = teleport
name = Saved spots
version = 1.0.0
author = sc-offline
api = 1.1
kind = native
entry = teleport.dll

[settings]
relocation = bool default true label "Allow moving the player (offline only)" help "Turn this off to keep the player in place. Saving a spot still works."
data_root = string default "" label "Data folder" help "Where places and saved spots are kept. Leave empty to use the launcher data folder."
spawn_file = string default "" label "Saved spot file" help "Where the saved spot is kept if no database is available. Leave empty for the default."
