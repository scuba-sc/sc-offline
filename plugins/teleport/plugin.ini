id = teleport
name = Quick-save and return
version = 1.0.0
author = sc-offline
api = 1.1
kind = native
entry = teleport.dll

[settings]
relocation = bool default true label "Allow moving the player (offline only)" help "Requests game.relocation when available. Product native startup is currently refused pending the reader/worker safety barrier, so moves remain unavailable."
data_root = string default "data" label "Legacy data root"
spawn_file = string default "" label "Legacy quick-save file" help "Empty uses launcher SC_OFFLINE_SPAWN_FILE, then data_root/spawn.txt"
