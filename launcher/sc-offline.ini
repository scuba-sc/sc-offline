# sc-offline launcher settings. Lines are "key = value"; a line starting with "#" is a comment.

# Your Star Citizen folder. Leave it commented out and the launcher finds the game itself
# (RSI Launcher records, usual folders, then a drive search, then a folder picker). Any of these forms work:
#   game = D:\Games\Roberts Space Industries
#   game = D:\Games\Roberts Space Industries\StarCitizen\LIVE
# game =

# Which install to use when game points above it: LIVE, PTU, EPTU, ...
channel = LIVE

# Boot map. PU_All boots every star system, so the Travel tab reaches Pyro and Nyx.
# Older ChrisWareOffline DLLs only understand PU.
boot_map = PU_All

# Legacy startup requests, still read and passed to the host. Empty start leaves the game's own spawn.
# The current external spawn plugin refuses destination startup: no timed Daymar arrival or boarding.
# start_ship does not select a normal menu spawn. These keys do not enable the missing startup route.
start_ship = DRAK_Cutlass_Black
start =
# Your aUEC balance isn't set here: it lives in data\wallet.txt (see docs/features.md).

# Load plugins from data\plugins\<id>\ (see docs/features.md, Plugins). A plugin runs its own code
# inside the game, so only install plugins you trust. mod.log lists every plugin found. sc-offline
# release recipe stages native features spawn, crew, build, npc, inspector, teleport, quantum (on), creative
# and discord (off; Discord presence unavailable). Other external implementations await staging; see docs/status.md.
# Catalog/drive data packs are supporting content, not extra native features. on or off.
plugins = on
# Let plugins move you (teleport F8, Travel destinations, bookmarks) through sco-core's game.relocation.
# Off turns moving the player off for every plugin. On never skips the offline check: a move also needs
# this release's host (sco-core main e616ed6 or later), a confirmed offline session, a live player and a known star system.
# Each plugin has its own relocation setting too. on or off.
relocation = on

# G13 broker enabled, external Multiplayer panel (M): no socket until explicit Host/Join.
# Broker default is exact loopback, NOT automatic LAN listening. New G13 SDK/host
# and positively certified offline/EAC/network admission are required. LAN requires
# explicit host bind + exact peers; see https://github.com/scuba-sc/sc-mp. on or off.
multiplayer = on
# Legacy launcher firewall ranges only; these never widen the G13 broker.
# Existing ini is preserved for compatibility, not imported as session consent.
multiplayer_allow =
# Ship terminals (ASOP), personal hangars, the hangar ship lift and ATC hails: Deliver stores a ship at
# the station, Retrieve brings it up in your hangar, Store takes it back. mod.log lists each part as
# ready or not. Stored ships last for the session. on or off.
asop = on
# Which ship list the terminals show with asop on: ships (every ship in data\ships.txt) or game (the
# game's own; offline its query fails, so it is empty). ships or game.
asop_fleet_list = ships
# Natural mining belongs to data/plugins/mining/plugin.ini [settings], off by default.
# Old mining/mining_debug ini and SC_OFFLINE_MINING* environment switches are ignored.
# To migrate deliberately with launcher/game closed, see data/plugins/mining/README.md.

# While you play, the launcher changes these on your PC and undoes them when the game closes.
# Windows asks for administrator rights once per play. Set any of them to off to do it yourself.
# block_network: Windows Firewall rules that block StarCitizen.exe (this install only), the RSI Launcher
# and the game's CrashHandler.exe while you play. sc-offline.exe itself stays online for updates.
block_network = on
# eac_hosts: the hosts line that stops the RSI Launcher downloading Easy Anti-Cheat again.
eac_hosts = on
# eac_rename: renames EasyAntiCheat_EOS.exe to .bak so Easy Anti-Cheat doesn't start.
eac_rename = on

# After the game closes, list the logs it wrote this session (Game.log, logbackups, Crashes)
# and ask twice before deleting them. Older logs are never touched. ask or off.
clean_logs = ask

# After a crash, offer to zip the logs (RSI handle, account numbers and Windows user name
# replaced) into data\crash-reports and open the bug form. Nothing is sent by itself. on or off.
crash_reports = on

# Check GitHub for a newer sc-offline when you play, and ask before installing it.
# Your saves and this file are kept. on or off. (sc-offline.exe update checks on demand.)
check_updates = on

# Which releases the update check offers: stable (full releases only) or prerelease
# (test builds too). stable or prerelease.
update_channel = stable

# Launcher UI language: en (default), ru or auto. Auto is used only when explicitly selected.
# Russian needs a manually installed data\locales\ru.ini; see docs/localization.md.
# Missing catalogue/font glyphs use English. CLI output and plugin-owned text stay unchanged.
language = en
